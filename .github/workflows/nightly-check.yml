name: Nightly Site Check

on:
  schedule:
    - cron: '0 4 * * *'  # 04:00 UTC every day
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run health checks
        run: |
          python scripts/check_sites.py || true

      - name: Generate exports
        run: |
          python scripts/generate_exports.py || true

      - name: Commit updates if any
        run: |
          git config user.name "textweb-bot"
          git config user.email "bot@lquessenberry.github.io"
          git add data/ exports/ last_check.txt || true
          git diff --staged --quiet || git commit -m "Nightly update: $(date -u +%Y-%m-%d)"
          git push || true

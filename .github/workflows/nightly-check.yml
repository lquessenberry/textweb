name: Nightly Site Check

on:
  schedule:
    - cron: '0 4 * * *'  # 04:00 UTC every day
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Placeholder for site checks
        run: |
          echo "Nightly check started"
          echo "TODO: Implement URL validation, status checks, and updates to data/sites.json"
          echo "Consider using curl, a small Python script, or lynx -dump for text extraction tests"
          date -u +%Y-%m-%d > last_check.txt

      - name: Commit if changed (example)
        if: false  # enable later
        run: |
          git config user.name "textweb-bot"
          git config user.email "bot@example.com"
          git add .
          git commit -m "Nightly update" || true
          git push

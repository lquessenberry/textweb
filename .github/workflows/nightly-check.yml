name: Nightly Site Check

# Health-check the catalog, refresh provenance, and commit when the tree changes.
# No secrets. Optional workflow_dispatch inputs are ordinary strings, not credentials.
on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC every day
  workflow_dispatch:
    inputs:
      limit:
        description: "Probe at most this many HTTP URLs (blank checks every site)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Validate only; do not probe or commit"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: textweb-nightly
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run nightly update
        env:
          TEXTWEB_LIMIT: ${{ github.event.inputs.limit }}
          TEXTWEB_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          args=(--workers 4 --timeout 10 --pause 0.25)
          if [ "$TEXTWEB_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ -n "$TEXTWEB_LIMIT" ]; then
            args+=(--limit "$TEXTWEB_LIMIT")
          fi
          python scripts/nightly.py "${args[@]}"

      - name: Validate schemas
        run: python scripts/validate_schema.py

      - name: Commit updates if any
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data exports api
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Nightly update: $(date -u +%Y-%m-%d)"
            git push
          fi
